[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "publicmind"
version = "0.1.0"
description = "Source-first public-figure knowledge aggregator with Obsidian export"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "markdownify>=0.13",
  "SQLAlchemy>=2.0",
  "urllib3>=1.26,<2",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2024.10"]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
publicmind = "app.backend.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.frontend" = ["*.html", "*.css", "*.js", "*.svg"]

[tool.ruff]
line-length = 100
target-version = "py39"
